[project]
name = "tokenizer-adversarial-robustness"
version = "0.1.0"
description = "Adversarial Attacks Expose Path-Dependent Failures in Discrete Medical Image Tokenizers"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "timm==1.0.8",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "tqdm>=4.66",
    "huggingface_hub>=0.24",
    "einops>=0.7",
    "pillow>=10.0",
    "numpy>=1.26,<2.0",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "typed-argument-parser>=1.9",
    "ftfy>=6.1",
    "regex>=2023.10.3",
    # generative-downstream reconstruction-fidelity metrics (LPIPS / PSNR / SSIM / rFID)
    "torchmetrics>=1.3",
    "lpips>=0.1.4",
    "torch-fidelity>=0.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
# The LLaVA-Med (MedITok) VQA red-team (scripts/generative/run_vqa_redteam.py)
# needs the meditok "understanding" fork's own pinned transformers, which
# conflicts with what torch/timm above want -- install this extra in a SEPARATE
# environment. See docs/checkpoints.md.
vqa = ["transformers==4.36.2", "accelerate>=0.21", "sentencepiece>=0.1.99"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
